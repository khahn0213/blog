<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관리자 로그인 — 기록 창고 admin</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="../assets/style.css">
</head>
<body style="background:var(--bg-soft)">

<main style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px">
  <div class="card" style="width:100%;max-width:380px;padding:36px 32px">
    <p class="heading-font" style="font-size:19px;font-weight:700;margin-bottom:28px">기록 창고 admin</p>

    <form id="login-form" style="display:flex;flex-direction:column;gap:14px">
      <label style="display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--text-muted);font-weight:600">
        이메일
        <input type="email" id="email" required autocomplete="username"
          style="padding:13px 14px;border-radius:10px;border:1px solid var(--bg-chip);font-size:15px;font-family:inherit">
      </label>
      <label style="display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--text-muted);font-weight:600">
        비밀번호
        <input type="password" id="password" required autocomplete="current-password"
          style="padding:13px 14px;border-radius:10px;border:1px solid var(--bg-chip);font-size:15px;font-family:inherit">
      </label>

      <p id="login-error" style="display:none;margin:0;font-size:13px;color:#D14343"></p>

      <button class="btn btn-primary" type="submit" style="justify-content:center;margin-top:8px">로그인</button>
    </form>

    <p style="margin:20px 0 0;font-size:12px;color:var(--text-faint);line-height:1.6">
      계정은 Firebase 콘솔 &gt; Authentication에서 직접 만든 이메일/비밀번호로 로그인합니다.<br>
      아직 설정하지 않았다면 <code>docs/firebase-setup.md</code>를 먼저 확인하세요.
    </p>
  </div>
</main>

<script type="module">
  import { auth, isFirebaseConfigured } from "../assets/firebase.js";
  import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

  const form = document.getElementById("login-form");
  const errorEl = document.getElementById("login-error");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorEl.style.display = "none";

    if (!isFirebaseConfigured || !auth) {
      errorEl.textContent = "Firebase 설정이 아직 되어 있지 않습니다 (assets/firebase.js 확인).";
      errorEl.style.display = "block";
      return;
    }

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    try {
      await signInWithEmailAndPassword(auth, email, password);
      window.location.href = "dashboard.html";
    } catch (err) {
      errorEl.textContent = "로그인에 실패했습니다. 이메일/비밀번호를 확인해주세요.";
      errorEl.style.display = "block";
      console.warn("[기록 창고] 로그인 실패:", err);
    }
  });
</script>
</body>
</html>
